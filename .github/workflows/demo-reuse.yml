name: "Demo: reuse (reusable workflow, composite, JS and Docker actions)"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/demo-reus*.yml", ".github/actions/**"]

permissions:
  contents: read

jobs:
  py310:
    uses: ./.github/workflows/demo-reusable.yml
    with:
      python-version: "3.10"
  py313:
    uses: ./.github/workflows/demo-reusable.yml
    with:
      python-version: "3.13"

  own-actions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: js
        uses: ./.github/actions/js-hello
        with:
          who: Actions
      - uses: ./.github/actions/docker-hello
        with:
          who: Actions
      - run: echo "JS action said '${{ steps.js.outputs.greeting }}'"

  report:
    needs: [py310, py313]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "pytest ${{ needs.py310.outputs.pytest-version }} on 3.10 and ${{ needs.py313.outputs.pytest-version }} on 3.13"
