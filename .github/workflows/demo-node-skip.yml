name: "Demo: a green run that skipped a test"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["demo/test_parity.py", ".github/workflows/demo-node-skip.yml"]

permissions:
  contents: read

jobs:
  no-node:
    name: No Node (parity test skips, job still green)
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install -r demo/requirements.txt
      - run: pytest -rs demo

  node-required:
    name: Node installed and required
    runs-on: ubuntu-24.04
    env:
      REQUIRE_NODE: "1"   # turn the skip into a failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: pip install -r demo/requirements.txt
      - run: pytest -rs demo
