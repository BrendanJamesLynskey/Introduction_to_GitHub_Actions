# The required check. A ruleset on main names this job ("Demo gate"), so a pull request
# cannot merge until it passes. No path filter: a required check that never starts
# stays "Expected" and blocks the merge for ever.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Demo gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r demo/requirements.txt
      - name: Tests (report skips with -rs)
        run: pytest -rs demo
